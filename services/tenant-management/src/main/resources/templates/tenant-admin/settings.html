<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{shared/layout/default}">
<head>
    <title>Tenant-Einstellungen</title>
    <style>
        .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--pico-muted-border-color); margin-bottom: 1.5rem; }
        .tabs a { padding: 0.75rem 1.25rem; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -2px; color: var(--pico-muted-color); }
        .tabs a.active { border-bottom-color: var(--pico-primary); color: var(--pico-primary); font-weight: bold; }
        .tabs a:hover { color: var(--pico-primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <section layout:fragment="content">
        <h2>Tenant-Einstellungen</h2>

        <nav class="tabs">
            <a th:href="@{/tenant/admin/settings(tab='general')}"
               th:classappend="${activeTab == 'general'} ? 'active'">Allgemein</a>
            <a th:href="@{/tenant/admin/settings(tab='oidc')}"
               th:classappend="${activeTab == 'oidc'} ? 'active'">OIDC</a>
            <a th:href="@{/tenant/admin/settings(tab='legal')}"
               th:classappend="${activeTab == 'legal'} ? 'active'">Impressum &amp; Datenschutz</a>
        </nav>

        <div th:classappend="${activeTab == 'general'} ? 'active'" class="tab-content">
            <form th:action="@{/tenant/admin/settings/general}" method="post">
                <fieldset>
                    <legend>Branding</legend>
                    <label for="displayName">Blog-Name</label>
                    <input type="text" id="displayName" name="displayName"
                           th:value="${tenant?.displayName}" required>
                    <label for="tagline">Tagline (optional)</label>
                    <input type="text" id="tagline" name="tagline"
                           th:value="${tenant?.tagline}">
                </fieldset>

                <fieldset>
                    <legend>Login-Methode</legend>
                    <label>
                        <input type="radio" name="loginMode" value="INTERNAL"
                               th:checked="${tenant == null or tenant.loginMode?.name() == 'INTERNAL'}">
                        Intern (formbasiert)
                    </label>
                    <label>
                        <input type="radio" name="loginMode" value="OIDC"
                               th:checked="${tenant?.loginMode?.name() == 'OIDC'}">
                        OIDC (Authentik)
                    </label>
                    <label>
                        <input type="radio" name="loginMode" value="BOTH"
                               th:checked="${tenant?.loginMode?.name() == 'BOTH'}">
                        Beides
                    </label>
                </fieldset>

                <fieldset>
                    <legend>Auto-Approval</legend>
                    <label>
                        <input type="checkbox" name="autoApproveOidc" value="true"
                               th:checked="${tenant?.autoApproveOidc}">
                        OIDC-Benutzer automatisch freigeben
                    </label>
                    <label for="autoApproveEmailDomains">E-Mail-Domains (kommagetrennt)</label>
                    <input type="text" id="autoApproveEmailDomains" name="autoApproveEmailDomains"
                           th:value="${tenant?.autoApproveEmailDomains != null ? #strings.listJoin(tenant.autoApproveEmailDomains, ', ') : ''}"
                           placeholder="example.com, company.org">
                </fieldset>

                <button type="submit">Speichern</button>
            </form>
        </div>

        <div th:classappend="${activeTab == 'oidc'} ? 'active'" class="tab-content">
            <form th:action="@{/tenant/admin/settings/oidc}" method="post">
                <fieldset>
                    <legend>OIDC-Provider-Konfiguration</legend>
                    <label for="oidcIssuerUrl">Issuer-URL</label>
                    <input type="url" id="oidcIssuerUrl" name="oidcIssuerUrl"
                           th:value="${tenant?.oidcIssuerUrl}"
                           placeholder="https://auth.example.com/application/o/myapp/">
                    <label for="oidcClientId">Client-ID</label>
                    <input type="text" id="oidcClientId" name="oidcClientId"
                           th:value="${tenant?.oidcClientId}">
                    <label for="oidcClientSecret">Client-Secret</label>
                    <input type="password" id="oidcClientSecret" name="oidcClientSecret"
                           th:placeholder="${tenant?.oidcClientSecret != null ? '***' : ''}">
                    <small>Leer lassen, um den bestehenden Wert beizubehalten.</small>
                </fieldset>

                <button type="submit">Speichern</button>
            </form>
        </div>

        <div th:classappend="${activeTab == 'legal'} ? 'active'" class="tab-content">
            <form th:action="@{/tenant/admin/settings/legal}" method="post">
                <fieldset>
                    <legend>Rechtliche Seiten</legend>
                    <label for="impressumContent">Impressum (HTML)</label>
                    <textarea id="impressumContent" name="impressumContent" rows="8"
                              th:text="${tenant?.impressumContent}"></textarea>
                    <label for="privacyPolicyContent">Datenschutzerklärung (HTML)</label>
                    <textarea id="privacyPolicyContent" name="privacyPolicyContent" rows="8"
                              th:text="${tenant?.privacyPolicyContent}"></textarea>
                    <small>Leer lassen für Standard-Platzhalter.</small>
                </fieldset>

                <button type="submit">Speichern</button>
            </form>
        </div>

        <nav>
            <a th:href="@{/tenant/admin/tenants}">Tenant-Verwaltung</a>
        </nav>
    </section>
</body>
</html>
