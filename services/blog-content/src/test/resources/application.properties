logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
spring.thymeleaf.check-template-location=false
grpc.client.user-management.address=static://localhost:9090
grpc.client.user-management.negotiation-type=plaintext
spring.session.store-type=none
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
