<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <div th:fragment="header">
        <nav>
            <ul>
                <li><strong><a th:href="@{/}" href="/">Toms Blog</a></strong></li>
            </ul>
            <ul>
                <li><a th:href="@{/}" href="/">Home</a></li>
                <li><a th:href="@{/posts}" href="/posts">Posts</a></li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="margin:0">
                        <button type="submit" class="outline secondary" style="padding:0.25rem 0.5rem;margin:0">
                            Logout (<span sec:authentication="name">admin</span>)
                        </button>
                    </form>
                </li>
                <li sec:authorize="isAnonymous()"><a th:href="@{/login}" href="/login">Login</a></li>
            </ul>
        </nav>
    </div>
</body>
</html>
