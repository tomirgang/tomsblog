<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Login</title>
</head>
<body>
    <section layout:fragment="content">
        <h1>Login</h1>

        <article th:if="${param.error}" aria-label="Fehler">
            <p role="alert"><strong>Anmeldung fehlgeschlagen.</strong> Benutzername oder Passwort falsch.</p>
        </article>

        <article th:if="${param.logout}" aria-label="Info">
            <p>Sie wurden erfolgreich abgemeldet.</p>
        </article>

        <h2>Mit Authentik anmelden</h2>
        <a th:href="@{/oauth2/authorization/authentik}" role="button">Mit Authentik anmelden</a>

        <hr>

        <details>
            <summary>Mit Benutzername und Passwort anmelden</summary>
            <form th:action="@{/login}" method="post">
                <label for="username">Benutzername</label>
                <input type="text" id="username" name="username" autocomplete="username" required>

                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <button type="submit">Anmelden</button>
            </form>
        </details>
    </section>
</body>
</html>
