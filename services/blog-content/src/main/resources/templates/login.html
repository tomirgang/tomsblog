<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Login</title>
</head>
<body>
    <section layout:fragment="content">
        <h1>Login</h1>

        <article th:if="${param.error}" aria-label="Fehler">
            <p role="alert"><strong>Anmeldung fehlgeschlagen.</strong> Benutzername oder Passwort falsch.</p>
        </article>

        <article th:if="${param.logout}" aria-label="Info">
            <p>Sie wurden erfolgreich abgemeldet.</p>
        </article>

        <!-- OIDC login: shown for OIDC and BOTH modes -->
        <div th:if="${loginMode == 'OIDC' or loginMode == 'BOTH'}">
            <h2>Mit Authentik anmelden</h2>
            <a th:href="@{/oauth2/authorization/authentik}" role="button">Mit Authentik anmelden</a>
        </div>

        <!-- Separator: only shown when both modes are active -->
        <hr th:if="${loginMode == 'BOTH'}">

        <!-- Internal login: shown for INTERNAL and BOTH modes -->
        <div th:if="${loginMode == 'INTERNAL' or loginMode == 'BOTH'}">
            <div th:if="${loginMode == 'BOTH'}">
                <details>
                    <summary>Mit Benutzername und Passwort anmelden</summary>
                    <form th:action="@{/login}" method="post">
                        <label for="username">Benutzername</label>
                        <input type="text" id="username" name="username" autocomplete="username" required>

                        <label for="password">Passwort</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>

                        <button type="submit">Anmelden</button>
                    </form>
                </details>
            </div>
            <div th:if="${loginMode == 'INTERNAL'}">
                <h2>Anmelden</h2>
                <form th:action="@{/login}" method="post">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>

                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>

                    <button type="submit">Anmelden</button>
                </form>
            </div>
        </div>

        <!-- Registration link: shown for INTERNAL and BOTH modes (SWR-060) -->
        <p th:if="${loginMode == 'INTERNAL' or loginMode == 'BOTH'}">
            Noch kein Konto? <a th:href="@{/register}">Registrieren</a>
        </p>
    </section>
</body>
</html>
