<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Registrieren</title>
</head>
<body>
    <section layout:fragment="content">
        <h1>Registrieren</h1>

        <article th:if="${error}" aria-label="Fehler">
            <p role="alert"><strong th:text="${error}">Fehlermeldung</strong></p>
        </article>

        <form th:action="@{/register}" method="post">
            <label for="username">Benutzername *</label>
            <input type="text" id="username" name="username"
                   th:value="${username}" autocomplete="username" required>

            <label for="email">E-Mail *</label>
            <input type="email" id="email" name="email"
                   th:value="${email}" autocomplete="email" required>

            <label for="displayName">Anzeigename</label>
            <input type="text" id="displayName" name="displayName"
                   th:value="${displayName}" autocomplete="name">

            <label for="password">Passwort * (mindestens 12 Zeichen)</label>
            <input type="password" id="password" name="password"
                   minlength="12" autocomplete="new-password" required>

            <label for="passwordConfirm">Passwort bestätigen *</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm"
                   minlength="12" autocomplete="new-password" required>

            <button type="submit">Registrieren</button>
        </form>

        <p>Bereits registriert? <a th:href="@{/login}">Anmelden</a></p>
    </section>
</body>
</html>
