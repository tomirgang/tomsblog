<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title>Posts</title>
</head>
<body>
    <section layout:fragment="content">
        <h1>Blog Posts</h1>

        <p sec:authorize="isAuthenticated()"><a th:href="@{/posts/new}" role="button">Neuen Post erstellen</a></p>

        <p th:if="${#lists.isEmpty(posts)}">Noch keine Beiträge vorhanden.</p>

        <article th:each="post : ${posts}">
            <header>
                <h2>
                    <a th:if="${post.status.name() == 'PUBLISHED'}"
                       th:href="@{/posts/{slug}(slug=${post.slug.value})}"
                       th:text="${post.title}">Post Title</a>
                    <span th:if="${post.status.name() != 'PUBLISHED'}"
                          th:text="${post.title}">Post Title</span>
                </h2>
                <small>
                    <mark th:if="${post.status.name() == 'DRAFT'}">Entwurf</mark>
                    <mark th:if="${post.status.name() == 'ARCHIVED'}">Archiviert</mark>
                    <time th:if="${post.publishedAt != null}"
                          th:datetime="${post.publishedAt}"
                          th:text="${#temporals.format(post.publishedAt, 'dd.MM.yyyy')}">
                        01.01.2026
                    </time>
                </small>
            </header>
            <p th:text="${excerpts[post.id.value]}">
                Post preview text...
            </p>
            <footer>
                <a th:if="${post.status.name() == 'PUBLISHED'}"
                   th:href="@{/posts/{slug}(slug=${post.slug.value})}">Weiterlesen</a>
                <a sec:authorize="isAuthenticated()"
                   th:href="@{/posts/{id}/edit(id=${post.id.value})}">Bearbeiten</a>
                <form sec:authorize="isAuthenticated()"
                      th:if="${post.status.name() == 'DRAFT'}"
                      th:action="@{/posts/{id}/publish(id=${post.id.value})}"
                      method="post" style="display:inline">
                    <button type="submit" class="secondary outline">Veröffentlichen</button>
                </form>
            </footer>
        </article>
    </section>
</body>
</html>
