<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${post.title}">Post Title</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <section layout:fragment="content">
        <article>
            <header>
                <h1 th:text="${post.title}">Post Title</h1>
                <small>
                    <time th:datetime="${post.publishedAt}"
                          th:text="${#temporals.format(post.publishedAt, 'dd.MM.yyyy')}">
                        01.01.2026
                    </time>
                </small>
            </header>

            <div th:utext="${renderedContent}">
                Post content goes here...
            </div>

            <footer th:if="${!post.sources.isEmpty()}">
                <h3>Quellen</h3>
                <ul>
                    <li th:each="source : ${post.sources}">
                        <a th:href="${source.url()}" th:text="${source.title()}"
                           rel="noopener noreferrer" target="_blank">Source Title</a>
                    </li>
                </ul>
            </footer>
        </article>

        <nav th:if="${previousPost != null or nextPost != null}" aria-label="Chronologische Navigation">
            <ul>
                <li th:if="${previousPost != null}">
                    <details>
                        <summary th:text="'&larr; ' + ${previousPost.title}">&larr; Vorheriger Post</summary>
                        <small>
                            <time th:datetime="${previousPost.publishedAt}"
                                  th:text="${#temporals.format(previousPost.publishedAt, 'dd.MM.yyyy')}">01.01.2026</time>
                        </small>
                        <div th:utext="${previousPostExcerpt}">Vorschau...</div>
                        <a th:href="@{/posts/{slug}(slug=${previousPost.slug.value})}">Zum Beitrag</a>
                    </details>
                </li>
                <li th:if="${nextPost != null}">
                    <details>
                        <summary th:text="${nextPost.title} + ' &rarr;'">Nächster Post &rarr;</summary>
                        <small>
                            <time th:datetime="${nextPost.publishedAt}"
                                  th:text="${#temporals.format(nextPost.publishedAt, 'dd.MM.yyyy')}">01.01.2026</time>
                        </small>
                        <div th:utext="${nextPostExcerpt}">Vorschau...</div>
                        <a th:href="@{/posts/{slug}(slug=${nextPost.slug.value})}">Zum Beitrag</a>
                    </details>
                </li>
            </ul>
        </nav>

        <nav th:if="${seriesPreviousPost != null or seriesNextPost != null}" aria-label="Serien-Navigation">
            <hgroup>
                <h4>Serie</h4>
            </hgroup>
            <ul>
                <li th:if="${seriesPreviousPost != null}">
                    <a th:href="@{/posts/{slug}(slug=${seriesPreviousPost.slug.value})}"
                       th:text="'&larr; Serie: ' + ${seriesPreviousPost.title}">&larr; Serie: Vorheriger Beitrag</a>
                </li>
                <li th:if="${seriesNextPost != null}">
                    <a th:href="@{/posts/{slug}(slug=${seriesNextPost.slug.value})}"
                       th:text="'Serie: ' + ${seriesNextPost.title} + ' &rarr;'">Serie: Nächster Beitrag &rarr;</a>
                </li>
            </ul>
        </nav>

        <nav>
            <a th:href="@{/posts}">&larr; Zurück zur Übersicht</a>
        </nav>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"
                crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script type="module">
            import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
            mermaid.initialize({ startOnLoad: true });
        </script>
        <script>hljs.highlightAll();</script>
    </section>
</body>
</html>
