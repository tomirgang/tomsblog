spring:
  application:
    name: blog-content

  session:
    store-type: redis

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration/blog

blog:
  default-tenant-id: "00000000-0000-0000-0000-000000000001"
  default-author-id: "00000000-0000-0000-0000-000000000001"
  auth-login-url: ${AUTH_LOGIN_URL:/auth/login}

# gRPC: plaintext is acceptable because Linkerd service mesh provides mTLS (ADR-0021)
grpc:
  client:
    user-management:
      address: static://${USER_MANAGEMENT_GRPC_HOST:localhost}:${USER_MANAGEMENT_GRPC_PORT:9090}
      negotiation-type: plaintext

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
