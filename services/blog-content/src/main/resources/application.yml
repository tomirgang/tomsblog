spring:
  application:
    name: blog-content

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

blog:
  default-tenant-id: "00000000-0000-0000-0000-000000000001"
  default-author-id: "00000000-0000-0000-0000-000000000001"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
