grpc.server.port=0
service.api-key=test-api-key
blog.admin.username=admin
blog.admin.password=test-admin-password-12345
spring.session.store-type=none
spring.security.oauth2.client.registration.authentik.client-id=test-client
spring.security.oauth2.client.registration.authentik.client-secret=test-secret
spring.security.oauth2.client.registration.authentik.scope=openid,profile,email
spring.security.oauth2.client.registration.authentik.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.authentik.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.authentik.authorization-uri=https://auth.example.com/authorize
spring.security.oauth2.client.provider.authentik.token-uri=https://auth.example.com/token
spring.security.oauth2.client.provider.authentik.user-info-uri=https://auth.example.com/userinfo
spring.security.oauth2.client.provider.authentik.jwk-set-uri=https://auth.example.com/jwks
