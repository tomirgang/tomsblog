<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{shared/layout/default}">
<head>
    <title>Users</title>
</head>
<body>
    <section layout:fragment="content">
        <h2>Benutzerverwaltung</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>E-Mail</th>
                    <th>Rolle</th>
                    <th>Status</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.displayName ?: user.username ?: user.oidcSubject}">Name</td>
                    <td th:text="${user.email}">email@example.com</td>
                    <td>
                        <span th:each="membership : ${user.tenantMemberships}"
                              th:if="${membership.tenantId().value().toString() == tenantId.toString()}"
                              th:text="${membership.role()}" class="badge"></span>
                    </td>
                    <td>
                        <span th:text="${user.approvalStatus}"
                              th:classappend="${user.approvalStatus.name() == 'PENDING'} ? 'contrast' : (${user.approvalStatus.name() == 'APPROVED'} ? '' : 'secondary')">
                        </span>
                    </td>
                    <td>
                        <div style="display:flex;gap:0.5rem;align-items:center">
                            <form th:if="${user.approvalStatus.name() == 'PENDING'}"
                                  th:action="@{/auth/admin/users/{id}/approve(id=${user.oidcSubject ?: user.username})}"
                                  method="post" style="margin:0">
                                <button type="submit" class="outline" style="padding:0.25rem 0.5rem;margin:0">Approve</button>
                            </form>
                            <form th:if="${user.approvalStatus.name() == 'PENDING'}"
                                  th:action="@{/auth/admin/users/{id}/reject(id=${user.oidcSubject ?: user.username})}"
                                  method="post" style="margin:0">
                                <button type="submit" class="outline secondary" style="padding:0.25rem 0.5rem;margin:0">Reject</button>
                            </form>
                            <form th:action="@{/auth/admin/users/{id}/role(id=${user.oidcSubject ?: user.username})}"
                                  method="post" style="margin:0;display:flex;gap:0.25rem;align-items:center">
                                <select name="role" style="padding:0.25rem;margin:0"
                                        th:with="currentRole=${user.tenantMemberships.?[tenantId().value().toString() == #root.tenantId.toString()].isEmpty() ? '' : user.tenantMemberships.?[tenantId().value().toString() == #root.tenantId.toString()][0].role().name()}">
                                    <option value="READER" th:selected="${currentRole == 'READER'}">READER</option>
                                    <option value="REVIEWER" th:selected="${currentRole == 'REVIEWER'}">REVIEWER</option>
                                    <option value="AUTHOR" th:selected="${currentRole == 'AUTHOR'}">AUTHOR</option>
                                    <option value="ADMIN" th:selected="${currentRole == 'ADMIN'}">ADMIN</option>
                                </select>
                                <button type="submit" class="outline" style="padding:0.25rem 0.5rem;margin:0">Set</button>
                            </form>
                            <form th:action="@{/auth/admin/users/{id}/delete(id=${user.oidcSubject ?: user.username})}"
                                  method="post" style="margin:0"
                                  onsubmit="return confirm('Benutzer wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.');">
                                <button type="submit" class="outline secondary" style="padding:0.25rem 0.5rem;margin:0">Löschen</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(users)}">Keine Benutzer in diesem Tenant.</p>
        <nav>
            <a th:href="@{/auth/admin/settings}">Tenant-Einstellungen</a>
        </nav>
    </section>
</body>
</html>
