apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-community-operator
  namespace: mongodb
spec:
  interval: 1h
  chart:
    spec:
      chart: community-operator
      version: "0.11.0"
      sourceRef:
        kind: HelmRepository
        name: mongodb
  values:
    operator:
      watchNamespace: mongodb
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 256Mi
          cpu: 250m
