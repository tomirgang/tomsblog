apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed
  namespace: tomsblog
  labels:
    app: feed
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: feed
  template:
    metadata:
      labels:
        app: feed
    spec:
      serviceAccountName: feed
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: feed
          image: ghcr.io/tomirgang/tomsblog/feed:0.10.5 # {"$imagepolicy": "flux-system:feed"}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JDK_JAVA_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0 -XX:+UseG1GC"
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s,kafka"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-cluster-rw.postgres.svc.cluster.local:5432/feed"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-cluster-app
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-cluster-app
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
