apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-content
  namespace: tomsblog
  labels:
    app: blog-content
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: blog-content
  template:
    metadata:
      labels:
        app: blog-content
    spec:
      serviceAccountName: blog-content
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: blog-content
          image: ghcr.io/tomirgang/tomsblog/blog-content:0.9.5 # {"$imagepolicy": "flux-system:blog-content"}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JDK_JAVA_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0 -XX:+UseG1GC"
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-cluster-rw.postgres.svc.cluster.local:5432/app"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-cluster-app
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-cluster-app
                  key: password
            - name: BLOG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-content-secrets
                  key: admin-password
            - name: USER_MANAGEMENT_GRPC_HOST
              value: "user-management.tomsblog.svc.cluster.local"
            - name: USER_MANAGEMENT_GRPC_PORT
              value: "9090"
            - name: SPRING_REDIS_HOST
              value: "redis.redis.svc.cluster.local"
            - name: SPRING_REDIS_PORT
              value: "6379"
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
