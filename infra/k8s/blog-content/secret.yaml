apiVersion: v1
kind: Secret
metadata:
  name: blog-content-secrets
  namespace: tomsblog
type: Opaque
stringData:
  admin-password: "changeme"
# Database credentials (postgres-cluster-app) are automatically mirrored
# from the postgres namespace via Reflector.
# Required one-time setup:
#   kubectl annotate secret postgres-cluster-app -n postgres \
#     reflector.v1.k8s.emberstack.com/reflection-allowed="true" \
#     reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces="tomsblog" \
#     reflector.v1.k8s.emberstack.com/reflection-auto-enabled="true" \
#     reflector.v1.k8s.emberstack.com/reflection-auto-namespaces="tomsblog"
