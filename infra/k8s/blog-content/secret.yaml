apiVersion: v1
kind: Secret
metadata:
  name: blog-content-secrets
  namespace: tomsblog
type: Opaque
stringData:
  admin-password: "changeme"
---
# This secret must be populated with the CNPG credentials.
# Copy from: kubectl get secret postgres-cluster-app -n postgres -o json |
#   jq '.metadata.namespace = "tomsblog" | .metadata.name = "blog-content-db"' |
#   kubectl apply -f -
# In production, use Reflector or External Secrets Operator to sync automatically.
apiVersion: v1
kind: Secret
metadata:
  name: blog-content-db
  namespace: tomsblog
type: Opaque
stringData:
  username: "blog_content"
  password: "changeme-sync-from-cnpg"
