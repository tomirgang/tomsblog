apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: tempo
      # Verify latest version: helm search repo grafana/tempo --versions
      version: "1.18.3"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    tempo:
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
      retention: 168h  # 7 days
    persistence:
      enabled: true
      storageClassName: hcloud-volumes
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
