apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: tomsblog
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: tomsblog
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux-automation
        email: flux@tomsblog.local
      messageTemplate: |
        chore(image): update images

        {{- range $resource, $changes := .Changed.Objects }}
        {{ $resource.Kind }}/{{ $resource.Name }}:
        {{- range $_, $change := $changes }}
          - {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{- end }}
        {{- end }}
    push:
      branch: main
  update:
    strategy: Setters
    path: ./infra/k8s
