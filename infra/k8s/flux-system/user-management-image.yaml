apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: user-management
  namespace: flux-system
spec:
  image: ghcr.io/tomirgang/tomsblog/user-management
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: user-management
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: user-management
  filterTags:
    pattern: '^\d+\.\d+\.\d+$'
  policy:
    semver:
      range: '>=0.1.0'
