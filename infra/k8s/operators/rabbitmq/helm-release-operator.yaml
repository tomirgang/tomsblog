apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rabbitmq-cluster-operator
  namespace: rabbitmq
spec:
  interval: 1h
  chart:
    spec:
      chart: rabbitmq-cluster-operator
      version: "4.4.34"
      sourceRef:
        kind: HelmRepository
        name: bitnami
  values:
    clusterOperator:
      image:
        registry: docker.io
        repository: rabbitmqoperator/cluster-operator
        tag: "2.16.1"
      watchAllNamespaces: false
      watchNamespaces:
        - rabbitmq
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 256Mi
          cpu: 250m
    msgTopologyOperator:
      enabled: false
    useCertManager: false
