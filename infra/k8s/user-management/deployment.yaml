apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management
  namespace: tomsblog
  labels:
    app: user-management
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: user-management
  template:
    metadata:
      labels:
        app: user-management
    spec:
      serviceAccountName: user-management
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: user-management
          image: ghcr.io/tomirgang/tomsblog/user-management:0.10.4 # {"$imagepolicy": "flux-system:user-management"}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 9090
              name: grpc
          env:
            - name: JDK_JAVA_OPTIONS
              value: "-XX:MaxRAMPercentage=65.0 -XX:+UseG1GC"
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-cluster-rw.postgres.svc.cluster.local:5432/user_management"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-cluster-app
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-cluster-app
                  key: password
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: user-management-secrets
                  key: service-api-key
            - name: BLOG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-management-secrets
                  key: admin-password
            - name: SPRING_REDIS_HOST
              value: "redis.redis.svc.cluster.local"
            - name: SPRING_REDIS_PORT
              value: "6379"
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
