apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-control-plane
  namespace: linkerd
spec:
  interval: 1h
  dependsOn:
    - name: linkerd-crds
  chart:
    spec:
      chart: linkerd-control-plane
      version: "1.16.11"
      sourceRef:
        kind: HelmRepository
        name: linkerd
  values:
    identity:
      externalCA: true
      issuer:
        scheme: kubernetes.io/tls
    proxy:
      resources:
        memory:
          request: 64Mi
          limit: 128Mi
        cpu:
          request: 20m
          limit: ""
    proxyInit:
      resources:
        memory:
          request: 20Mi
          limit: 20Mi
        cpu:
          request: 10m
          limit: 100m
