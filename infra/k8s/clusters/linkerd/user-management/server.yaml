apiVersion: policy.linkerd.io/v1beta1
kind: Server
metadata:
  name: user-management-http
  namespace: tomsblog
  labels:
    app: user-management
spec:
  podSelector:
    matchLabels:
      app: user-management
  port: http
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1beta1
kind: Server
metadata:
  name: user-management-grpc
  namespace: tomsblog
  labels:
    app: user-management
spec:
  podSelector:
    matchLabels:
      app: user-management
  port: grpc
  proxyProtocol: HTTP/2
