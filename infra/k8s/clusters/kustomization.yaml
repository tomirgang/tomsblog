apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Kafka cluster and topics (requires Strimzi CRDs)
  - kafka/cluster.yaml
  - kafka/topics.yaml
  - kafka/network-policy.yaml
  # MongoDB cluster (requires MongoDB Community Operator CRDs)
  - mongodb/secret.yaml
  - mongodb/cluster.yaml
  - mongodb/network-policy.yaml
  # RabbitMQ cluster (requires RabbitMQ Cluster Operator CRDs)
  - rabbitmq/cluster.yaml
  - rabbitmq/network-policy.yaml
  # ServiceMonitors (requires kube-prometheus-stack CRDs)
  - monitoring/blog-content-servicemonitor.yaml
  - monitoring/user-management-servicemonitor.yaml
  - monitoring/tenant-management-servicemonitor.yaml
  - monitoring/feed-servicemonitor.yaml
