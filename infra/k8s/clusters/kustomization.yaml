apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Kafka cluster and topics (requires Strimzi CRDs)
  - kafka/cluster.yaml
  - kafka/topics.yaml
  - kafka/network-policy.yaml
  # MongoDB cluster (requires MongoDB Community Operator CRDs)
  - mongodb/secret.yaml
  - mongodb/cluster.yaml
  - mongodb/network-policy.yaml
  # RabbitMQ cluster (requires RabbitMQ Cluster Operator CRDs)
  - rabbitmq/cluster.yaml
  - rabbitmq/network-policy.yaml
  # ServiceMonitors (requires kube-prometheus-stack CRDs)
  - monitoring/blog-content-servicemonitor.yaml
  - monitoring/user-management-servicemonitor.yaml
  - monitoring/tenant-management-servicemonitor.yaml
  - monitoring/feed-servicemonitor.yaml
  # Linkerd policies (requires Linkerd CRDs)
  - linkerd/blog-content/server.yaml
  - linkerd/blog-content/authz-policy-traefik.yaml
  - linkerd/blog-content/authz-policy-probes.yaml
  - linkerd/user-management/server.yaml
  - linkerd/user-management/authz-policy-grpc.yaml
  - linkerd/user-management/authz-policy-probes.yaml
  - linkerd/user-management/authz-policy-traefik.yaml
  - linkerd/tenant-management/server.yaml
  - linkerd/tenant-management/authz-policy-grpc.yaml
  - linkerd/tenant-management/authz-policy-probes.yaml
  - linkerd/tenant-management/authz-policy-traefik.yaml
  - linkerd/feed/server.yaml
  - linkerd/feed/authz-policy-probes.yaml
