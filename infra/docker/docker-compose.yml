services:

  # Database per Service: each service gets its own PostgreSQL/MongoDB instance (ADR-0019)
  postgres-blog-content:
    image: postgres:17
    container_name: tomsblog-postgres-blog-content
    environment:
      POSTGRES_DB: blog_content
      POSTGRES_USER: ${BLOG_CONTENT_DB_USER:-tomsblog}
      POSTGRES_PASSWORD: ${BLOG_CONTENT_DB_PASSWORD:-tomsblog}
    ports:
      - "5432:5432"
    volumes:
      - postgres_blog_content_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tomsblog}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tomsblog-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: tomsblog-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-logs
      CLUSTER_ID: "tomsblog-dev-cluster-001"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: tomsblog-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "9080:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Database per Service: User Management gets its own PostgreSQL instance (ADR-0019)
  postgres-user-management:
    image: postgres:17
    container_name: tomsblog-postgres-user-management
    environment:
      POSTGRES_DB: user_management
      POSTGRES_USER: ${USER_MGMT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_MGMT_DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_management_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Database per Service: Tenant Management gets its own PostgreSQL instance (ADR-0019)
  postgres-tenant-management:
    image: postgres:17
    container_name: tomsblog-postgres-tenant-management
    environment:
      POSTGRES_DB: tenant_management
      POSTGRES_USER: ${TENANT_MGMT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TENANT_MGMT_DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_tenant_management_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Database per Service: Feed Service gets its own PostgreSQL instance (ADR-0019)
  postgres-feed:
    image: postgres:17
    container_name: tomsblog-postgres-feed
    environment:
      POSTGRES_DB: feed
      POSTGRES_USER: ${FEED_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${FEED_DB_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - postgres_feed_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: tomsblog-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tomsblog}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tomsblog}
      RABBITMQ_DEFAULT_VHOST: tomsblog
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_blog_content_data:
  postgres_user_management_data:
  postgres_tenant_management_data:
  postgres_feed_data:
  rabbitmq_data:
