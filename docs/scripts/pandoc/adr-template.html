<!DOCTYPE html>
<html>
<head>
  <title>$title$</title>
  <meta charset="utf-8" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    .content { max-width: 900px; margin: 0 auto; padding: 24px; line-height: 1.6; }
    h1 { border-bottom: 1px solid #eee; padding-bottom: 8px; }
    h2 { margin-top: 24px; color: #333; }
    code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-size: 90%; }
    pre { background: #f5f5f5; padding: 16px; border-radius: 6px; overflow-x: auto; }
    pre > code { background: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #f5f5f5; }
    ul, ol { padding-left: 24px; }
    a { color: #0366d6; }
    .plantuml-diagram svg { max-width: 100%; height: auto; }
    .plantuml-fallback { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 12px; margin: 16px 0; }
    pre.mermaid { background: white; border: 1px solid #eee; text-align: center; }
  </style>
$highlighting-css$
</head>
<body>
$if(nav-bar)$
$nav-bar$
$endif$
<div class="content">
$body$
</div>
<script type="module">
  // Only load mermaid.js if there are mermaid diagrams on the page
  if (document.querySelector('pre.mermaid')) {
    import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')
      .then(function(mod) { mod.default.initialize({ startOnLoad: true }); });
  }
</script>
</body>
</html>
