syntax = "proto3";

package de.tomsblog.usermanagement.grpc;

option java_multiple_files = true;
option java_package = "de.tomsblog.grpc.usermanagement";
option java_outer_classname = "UserManagementProto";

// Service for synchronous inter-service communication with User Management.
// Used by other services (e.g., blog-content) to sync users and query profiles.
// Fulfills SWR-046: gRPC for synchronous inter-service calls.
service UserManagementService {
  // Synchronize an OIDC user profile (create or update) and return the result.
  rpc SyncOidcUser (SyncOidcUserRequest) returns (UserProfileResponse);

  // Find a user profile by username.
  rpc FindByUsername (FindByUsernameRequest) returns (UserProfileResponse);

  // Find a user profile by OIDC subject.
  rpc FindByOidcSubject (FindByOidcSubjectRequest) returns (UserProfileResponse);

  // List all users belonging to a specific tenant (SWR-051).
  rpc ListUsersByTenant (ListUsersByTenantRequest) returns (ListUsersResponse);

  // Approve a user (SWR-051).
  rpc ApproveUser (ApproveUserRequest) returns (UserProfileResponse);

  // Reject a user (SWR-051).
  rpc RejectUser (RejectUserRequest) returns (UserProfileResponse);

  // Change a user's role in a tenant (SWR-051).
  rpc ChangeUserRole (ChangeUserRoleRequest) returns (UserProfileResponse);

  // Register a new local user (SWR-059).
  rpc RegisterUser (RegisterUserRequest) returns (UserProfileResponse);

  // Delete a user (SWR-093).
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
}

// Service for tenant settings queries.
service TenantSettingsService {
  // Get tenant settings (login mode, auto-approval configuration).
  rpc GetTenantSettings (GetTenantSettingsRequest) returns (TenantSettingsResponse);

  // Update tenant settings (SWR-052).
  rpc UpdateTenantSettings (UpdateTenantSettingsRequest) returns (TenantSettingsResponse);

  // List all tenants (SWR-053).
  rpc ListTenants (ListTenantsRequest) returns (ListTenantsResponse);
}

message SyncOidcUserRequest {
  string oidc_subject = 1;
  string email = 2;
  string display_name = 3;
  repeated string oidc_groups = 4;
  string tenant_id = 5;
}

message FindByUsernameRequest {
  string username = 1;
}

message FindByOidcSubjectRequest {
  string oidc_subject = 1;
}

message GetTenantSettingsRequest {
  string tenant_id = 1;
}

message UserProfileResponse {
  string id = 1;
  string oidc_subject = 2;
  string username = 3;
  string auth_source = 4;
  string email = 5;
  string display_name = 6;
  string approval_status = 7;
  repeated string global_roles = 8;
  repeated TenantMembership tenant_memberships = 9;
}

message TenantMembership {
  string tenant_id = 1;
  string role = 2;
}

message TenantSettingsResponse {
  string tenant_id = 1;
  string login_mode = 2;
  bool auto_approve_oidc = 3;
  repeated string auto_approve_email_domains = 4;
  string display_name = 5;
  string tagline = 6;
  string impressum_content = 7;
  string privacy_policy_content = 8;
  string oidc_issuer_url = 9;
  string oidc_client_id = 10;
  // Contains the actual secret for service-to-service use (mTLS protected).
  // The UI layer is responsible for masking before displaying.
  string oidc_client_secret = 11;
  string oidc_button_text = 12;
  string default_role = 13;
  string logo_url = 14;
  string favicon_url = 15;
  bool oidc_role_mapping_enabled = 16;
  map<string, string> oidc_role_mappings = 17;
}

message ListUsersByTenantRequest {
  string tenant_id = 1;
}

message ListUsersResponse {
  repeated UserProfileResponse users = 1;
}

message ApproveUserRequest {
  string identifier = 1;
}

message RejectUserRequest {
  string identifier = 1;
}

message ChangeUserRoleRequest {
  string identifier = 1;
  string tenant_id = 2;
  string role = 3;
}

message RegisterUserRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string display_name = 4;
  string tenant_id = 5;
}

message DeleteUserRequest {
  string identifier = 1;
  string tenant_id = 2;
  string requesting_user = 3;
}

message DeleteUserResponse {
  bool success = 1;
}

message UpdateTenantSettingsRequest {
  string tenant_id = 1;
  string login_mode = 2;
  bool auto_approve_oidc = 3;
  repeated string auto_approve_email_domains = 4;
  string display_name = 5;
  string tagline = 6;
  string impressum_content = 7;
  string privacy_policy_content = 8;
  string oidc_issuer_url = 9;
  string oidc_client_id = 10;
  string oidc_client_secret = 11;
  string oidc_button_text = 12;
  string default_role = 13;
  string logo_url = 14;
  string favicon_url = 15;
  bool oidc_role_mapping_enabled = 16;
  map<string, string> oidc_role_mappings = 17;
}

message ListTenantsRequest {
}

message TenantInfoResponse {
  string tenant_id = 1;
  string display_name = 2;
}

message ListTenantsResponse {
  repeated TenantInfoResponse tenants = 1;
}
