<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Toms Blog">Toms Blog</title>
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
    <link th:if="${faviconUrl}" rel="icon" th:href="${faviconUrl}" type="image/x-icon">
</head>
<body>
    <header class="container">
        <div th:replace="~{fragments/header :: header}"></div>
    </header>

    <main class="container">
        <section layout:fragment="content">
            <p>Content goes here.</p>
        </section>
    </main>

    <footer class="container">
        <div th:replace="~{shared/fragments/footer :: footer}"></div>
    </footer>
</body>
</html>
