text: |
  Alle relevanten UI-Use-Cases der Plattform müssen durch End-to-End-Tests
  mit Selenium im Browser abgedeckt sein. Die Tests simulieren echte
  Benutzerinteraktionen (Navigation, Formulareingaben, Klicks, Validierungen)
  und verifizieren das korrekte Verhalten der Anwendung aus Benutzersicht.

  Die E2E-Tests müssen:
  - in einer realistischen Browserumgebung (Chrome/Firefox headless) laufen
  - die vollständige Kette von UI über Backend bis Datenbank durchlaufen
  - unabhängig voneinander und wiederholbar ausführbar sein
  - in die CI/CD-Pipeline integriert sein
  - bei Fehlschlag aussagekräftige Fehlermeldungen und Screenshots liefern
