text: |
  Auf der Detailseite eines Blog-Posts sollen Links zum chronologisch
  vorherigen und nächsten Post angezeigt werden (basierend auf dem
  Veröffentlichungsdatum). Damit können Leser bequem durch alle
  veröffentlichten Posts navigieren.
