text: |
  Als Betreiber möchte ich Posts für einen definierten Zeitraum als
  „Featured" kennzeichnen können, damit diese auf der Landing Page
  hervorgehoben dargestellt werden. Featured Posts erscheinen zusätzlich
  zu den neuesten Posts in einem eigenen, visuell abgesetzten Bereich.
  Der Feature-Zeitraum wird durch ein Start- und Enddatum definiert.
  Nach Ablauf des Zeitraums verliert der Post automatisch seinen
  Featured-Status, ohne dass eine manuelle Aktion erforderlich ist.
