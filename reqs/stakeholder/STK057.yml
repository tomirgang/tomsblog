text: |
  Als Tenant-Administrator möchte ich Benutzer meines Tenants über die
  Admin-UI löschen können, um Konten zu entfernen, die nicht mehr benötigt
  werden.

  Das Löschen eines Benutzers entfernt die Tenant-Mitgliedschaft und die
  zugehörigen Benutzerdaten. Posts des gelöschten Benutzers bleiben
  erhalten, der Autorenname wird beibehalten.

  Es muss eine Sicherheitsabfrage (Bestätigungsdialog) vor dem Löschen
  geben. Der eigene Account und der SUPERADMIN-Account dürfen nicht
  gelöscht werden.
