text: |
  Alle HTTP-Requests müssen automatisch auf HTTPS umgeleitet werden.
  Ausgenommen sind Requests auf den Pfad /.well-known/acme-challenge/,
  die für die Let's Encrypt ACME HTTP-01 Challenge-Validierung
  unverschlüsselt erreichbar bleiben müssen.
