text: |
  Als Autor oder Admin möchte ich einen unveröffentlichten Post (Status DRAFT)
  in einer vollständigen Vorschau betrachten können, die exakt der späteren
  Darstellung nach Veröffentlichung entspricht (inklusive Markdown-Rendering,
  Syntax-Highlighting und Mermaid-Diagramme), damit ich das Ergebnis vor der
  Publikation prüfen kann.

  Die Vorschau muss nur für authentifizierte Benutzer mit Schreibberechtigung
  (AUTHOR, ADMIN, SUPERADMIN) zugänglich sein.
