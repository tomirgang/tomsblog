header: |
  OIDC Konfiguration über Infrastruktur oder Admin UI
level: 33.0
links: []
normative: true
ref: ''
reviewed: 7mYQktnOEVEw9mLUsQPhH2EmbjDt9GA3upK94dSi0oI=
text: |
  Die OIDC-Konfiguration (Client-ID, Client-Secret, Endpunkt-URLs)
  soll über die Infrastruktur-Konfiguration (Umgebungsvariablen,
  Kubernetes Secrets) oder über die Admin-UI möglich sein.
  Eine Änderung der OIDC-Konfiguration darf kein Neubauen des
  Container-Images erfordern.
