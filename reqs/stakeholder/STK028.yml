text: |
  Die Plattform muss unterstützen, dass neue Benutzer durch den
  Tenant-Administrator freigegeben (approved) werden müssen, bevor sie
  über die Rolle Reader hinausgehende Rechte erhalten. Bis zur
  Freigabe hat ein registrierter Benutzer nur Lesezugriff.
