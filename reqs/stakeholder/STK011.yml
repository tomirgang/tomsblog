text: |
  Das System soll KI-Features anbieten (Übersetzung, Schreibassistenz,
  Titelbild-Generierung). Alle KI-Features sind optional und werden
  vom Autor explizit ausgelöst. Ergebnisse müssen geprüft werden.
  Bei Ausfall des KI-Providers muss das System ohne KI funktionieren.
