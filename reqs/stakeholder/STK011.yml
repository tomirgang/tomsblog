text: |
  Das System soll KI-Features anbieten (Uebersetzung, Schreibassistenz,
  Titelbild-Generierung). Alle KI-Features sind optional und werden
  vom Autor explizit ausgeloest. Ergebnisse muessen geprueft werden.
  Bei Ausfall des KI-Providers muss das System ohne KI funktionieren.
