text: |
  Alle Requests von unbekannten bzw. nicht konfigurierten Domains
  müssen auf https://blog.tomirgang.de umgeleitet werden.
  Dies stellt sicher, dass fehlgeleiteter Traffic oder nicht
  autorisierte Domain-Zuordnungen auf die Hauptseite verweisen.
