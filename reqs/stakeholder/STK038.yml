text: |
  Als Architekt möchte ich, dass die asynchrone Kommunikation zwischen
  Microservices über Kafka (Event-Streaming) oder RabbitMQ (Task-Queues)
  abgewickelt wird, je nach Use-Case, damit eine lose Kopplung und
  zuverlässige Nachrichtenzustellung sichergestellt ist.
