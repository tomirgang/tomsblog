text: |
  Als Betreiber möchte ich, dass alle Microservices untereinander ausschließlich
  verschlüsselt und authentifiziert kommunizieren (mTLS), damit kein unautorisierter
  Service auf interne APIs zugreifen kann (Zero-Trust-Prinzip).
