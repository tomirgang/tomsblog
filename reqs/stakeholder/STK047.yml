text: |
  Administratoren sollen die OIDC-Provider-Konfiguration (Client-ID,
  Client-Secret, Issuer-URL) pro Tenant über die Admin-Oberfläche
  verwalten können. Die bestehende globale OIDC-Konfiguration über
  Umgebungsvariablen dient als Fallback, wenn keine tenant-spezifische
  Konfiguration hinterlegt ist. Eine Änderung der OIDC-Konfiguration
  darf keinen Neustart der Anwendung erfordern.
