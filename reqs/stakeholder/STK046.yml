text: |
  Als Besucher möchte ich mich auf der Plattform mit E-Mail-Adresse und
  Passwort registrieren können (lokaler Account), damit ich ohne einen
  externen Identity-Provider ein Benutzerkonto anlegen kann. Nach der
  Registrierung erhalte ich zunächst die Rolle Reader. Weitergehende
  Rechte werden erst nach Freigabe durch den Tenant-Administrator
  erteilt (siehe STK028).
