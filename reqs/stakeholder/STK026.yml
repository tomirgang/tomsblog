text: |
  Posts sollen Serien zu bestimmten Themen unterstützen. Ein Post kann
  optional einen vorherigen und einen nächsten Post innerhalb derselben
  Serie referenzieren. Diese Serien-Links sollen in der UI angezeigt
  werden, sofern sie nicht mit der chronologischen Navigation (vorheriger/
  nächster Post nach Veröffentlichungsdatum) übereinstimmen.
