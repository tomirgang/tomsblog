text: |
  Das System muss verschiedene Benutzerrollen unterstützen:
  Super-Administrator (Plattform- und Tenant-Verwaltung),
  Administrator (Benutzer- und Inhaltsverwaltung innerhalb eines Tenants),
  Autor, Reviewer und Leser. Zugriffsrechte werden rollenbasiert vergeben.
  Nicht angemeldete Benutzer werden wie Leser behandelt.
