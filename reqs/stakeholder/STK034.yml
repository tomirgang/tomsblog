text: |
  Konfiguration und Deployment der Applikation auf einem generischen
  Kubernetes Cluster soll in docs/ADMINS.md beschrieben sein.
  Die Dokumentation muss alle notwendigen Schritte, Konfigurationsparameter,
  Secrets und Beispiele enthalten, damit ein Administrator die Plattform
  ohne projektspezifisches Vorwissen deployen kann.
