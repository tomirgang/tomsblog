text: |
  Jeder Microservice besitzt seine eigene, dedizierte Datenbank-Instanz.
  Die Technologiewahl (PostgreSQL oder MongoDB) wird pro Service entschieden.
  Auch wenn mehrere Services PostgreSQL verwenden, erhaelt jeder eine eigene
  Instanz. Kein Service darf direkt auf die Datenbank eines anderen Services
  zugreifen. Service-uebergreifender Datenzugriff erfolgt ausschliesslich
  ueber gRPC (SWA-009) oder Domain Events (SWA-005).
