text: |
  Das Domain-Modell wird um ein ContentType-Enum (HTML, MARKDOWN) erweitert.
  Das Feld wird im Post-Aggregate gespeichert und über eine Flyway-Migration
  (V4) als VARCHAR(20)-Spalte mit Default 'HTML' in der Datenbank angelegt.
  Der ContentType steuert, ob der Inhalt vor der Anzeige durch den
  MarkdownRenderer verarbeitet werden muss.
