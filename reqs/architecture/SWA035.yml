text: |
  Das E2E-Test-Modul (e2e-tests/) ist ein separates Maven-Modul auf
  Root-Ebene, das serviceubergreifende Browser-Tests mit Selenium
  WebDriver ausfuehrt.

  Architektur:
  - Maven-Modul mit Profil 'e2e' (nicht im Default-Build)
  - Testcontainers-Selenium fuer Chrome-Browser-Container
  - Testcontainers-PostgreSQL fuer Datenbankinstanzen
  - Spring Boot Test fuer das Starten der Services
  - Page Object Model (POM) fuer Template-Abstraktion
  - JUnit 5 Extension fuer Screenshot-on-Failure

  Ausfuehrung:
  - Lokal: ./mvnw verify -Pe2e
  - CI: separater GitHub Actions Job
  - Release: Pflichtschritt in scripts/release.sh

  Abhaengigkeiten:
  - blog-content (test scope)
  - user-management (test scope)
  - tenant-management (test scope)
  - selenium-java
  - testcontainers (selenium, postgresql)
