text: |
  Die Landing Page beschränkt die Anzeige auf maximal drei Posts. Dafür
  wird am PostRepository-Port eine neue Methode
  findRecentPublishedByTenantId(TenantId, int limit) definiert. Die
  JPA-Implementierung nutzt Spring Data Pageable (PageRequest.of(0, limit))
  um die Begrenzung effizient auf Datenbankebene durchzuführen, statt alle
  Posts zu laden und im Speicher zu beschneiden.
