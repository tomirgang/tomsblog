text: |
  Die Authentifizierung und Autorisierung wird als eigener Microservice
  implementiert (kein Keycloak). Der Auth Service unterstützt OIDC als
  Relying Party und stellt JWTs für die interne Service-Kommunikation aus.
  Andere Services validieren Tokens lokal via Public Key.
