text: |
  Die Authentifizierung erfolgt über Authentik (https://auth.do9ita.de)
  als externem OIDC Provider (ADR-0027). Ein leichtgewichtiger interner
  User-Management-Service verwaltet plattformspezifische Benutzerprofile,
  Rollen (ADMIN, AUTHOR, READER) und Tenant-Zuordnungen. Services mit
  Web-UI agieren als OAuth2 Client (Spring Security OAuth2 Login).
  API-Endpunkte werden als OAuth2 Resource Server geschützt. Der
  User-Management-Service synchronisiert Benutzerdaten aus dem OIDC
  ID Token und stellt eine REST-API für Profil- und Rollenabfragen
  bereit.
