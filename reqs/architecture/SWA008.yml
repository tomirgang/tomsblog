text: |
  Uebersetzungen werden als eigenes Aggregate modelliert (nicht als Child im Post).
  Der Lifecycle ist: DRAFT -> REVIEW_PENDING -> APPROVED oder REJECTED.
  AI-generierte Uebersetzungen starten in REVIEW_PENDING (Autor muss pruefen).
  Manuelle Uebersetzungen starten in DRAFT.
  Bei Aenderung einer approbierten Uebersetzung wechselt der Status auf REVIEW_PENDING.
