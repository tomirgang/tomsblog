text: |
  Die Tenant-Auflösung erfolgt am Ingress-Level über den Host-Header.
  Ein Tenant-Resolution-Service mappt Domains auf TenantIds.
  Ein Tenant kann mehrere Domains besitzen (Custom-Domain + Plattform-Subdomain).
  Die aufgelöste TenantId wird als Header (X-Tenant-Id) an nachgelagerte
  Services propagiert.
