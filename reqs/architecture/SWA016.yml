text: |
  Die API-Dokumentation wird mit springdoc-openapi (v2.x) automatisch aus dem
  Code generiert. springdoc-openapi-starter-webmvc-ui stellt sowohl die
  OpenAPI-Spezifikation als auch das Swagger UI bereit. Die Annotationen
  @Operation, @ApiResponse und @Tag aus io.swagger.v3.oas.annotations werden
  an den REST-Controllern verwendet. Ein globaler OperationCustomizer fügt
  den X-Tenant-Id Header automatisch zu allen Operationen hinzu.
  Die Version wird zentral im Parent POM verwaltet.
