text: |
  Das Kubernetes-Cluster wird mit dem CLI-Tool hetzner-k3s
  auf Hetzner Cloud provisioniert. Konfiguration: 1 Controller (CPX22, 2 vCPU, 4 GB),
  2 Worker-Nodes (CPX22, 2 vCPU, 4 GB), Standort Nuernberg (nbg1).
  CNI: Flannel (k3s-Standard). Hetzner CSI (hcloud-volumes) und CCM sind integriert.
  Updates erfolgen manuell via hetzner-k3s upgrade.
  Die Cluster-Provisionierung liegt in einem separaten Repository (kubernetes-playground/k3s/),
  getrennt von den applikationsspezifischen Kubernetes-Ressourcen.
