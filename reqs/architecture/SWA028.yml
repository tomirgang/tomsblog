text: |
  Der JPA Persistence Adapter wird um eine Abfrage für aktuell gefeatured
  Posts erweitert:
  - Das PostRepository-Interface (Outbound Port) erhält die Methode
    findFeaturedByTenantId(TenantId, LocalDate): List<Post>.
  - Die JPA-Implementierung verwendet eine JPQL-Query mit Filterung auf
    Status PUBLISHED, featuredFrom <= aktuelles Datum und
    featuredUntil >= aktuelles Datum.
  - Sortierung nach featuredFrom absteigend.
  - Der Thymeleaf-Controller (LandingPageController oder PostViewController)
    ruft die neue Repository-Methode auf und übergibt das Ergebnis als
    Modell-Attribut an das Template.
