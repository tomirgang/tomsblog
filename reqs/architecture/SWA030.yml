text: |
  Jeder Service, der eine PostgreSQL-Datenbank benoetigt, erhaelt eine
  dedizierte CloudNativePG Database-Ressource (CRD). Die Database-Ressource
  definiert den Datenbanknamen, den Owner und die Zuordnung zum Cluster.
  Aktuelle Datenbanken:
  - blog_content (blog-content Service)
  - user_management (user-management Service)
  Die Cluster-Definition nutzt einen neutralen Platzhalter (database: app)
  im initdb-Block. Weitere Service-Datenbanken werden durch Hinzufuegen
  weiterer Database-Manifeste erstellt. Die Migration bestehender Datenbanken
  erfolgt durch Erstellen der Database-Ressource (adopt existing).
