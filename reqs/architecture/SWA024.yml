text: |
  Das Markdown-Rendering wird über einen dedizierten Outbound Port
  (MarkdownRenderer) abstrahiert. Die Implementierung
  (FlexmarkMarkdownRenderer) nutzt flexmark-java 0.64.8 zur serverseitigen
  Konvertierung von Markdown zu HTML. Der Port liegt im Package
  application.port.outbound, der Adapter im Package adapter.outbound.markdown.
  Diese Trennung ermöglicht den späteren Austausch der Rendering-Engine ohne
  Änderung an der Domain oder den Inbound-Adaptern.
