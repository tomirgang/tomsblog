text: |
  Jeder Microservice folgt der hexagonalen Architektur mit den Schichten:
  domain/ (reine Fachlogik, keine Framework-Abhängigkeiten),
  application/ (Ports, Use Cases),
  adapter/inbound (REST Controller, Event Listener),
  adapter/outbound (JPA Repositories, Kafka Producer, HTTP Clients).
