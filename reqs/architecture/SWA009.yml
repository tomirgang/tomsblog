text: |
  Für synchrone Kommunikation zwischen Microservices wird gRPC verwendet.
  Kafka bleibt für asynchrone, event-basierte Kommunikation zuständig.
  gRPC bietet typsichere Contracts via Protobuf, effizientes Binary-Protokoll
  und native Streaming-Unterstützung. Service-Interfaces werden als
  .proto-Dateien in einer geteilten Library definiert.
