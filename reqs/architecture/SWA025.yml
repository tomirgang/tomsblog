text: |
  Querschnittliche Modellattribute (z.B. Anwendungsversion) werden über
  Spring @ControllerAdvice bereitgestellt. Der VersionModelAdvice injiziert
  die Build-Version aus Spring Boot BuildProperties (mit Fallback auf
  spring.application.version) als globales Modelattribut „appVersion" in
  alle Thymeleaf-Views. Dieses Pattern vermeidet Duplikation in jedem
  einzelnen Controller-Handler.
