text: |
  Audit-Logging wird als Cross-Cutting Concern über den Shared Kernel
  bereitgestellt und in jedem Service lokal persistiert.

  Shared Kernel stellt bereit:
  - AuditLogEntry: Framework-freies Record mit id, timestamp, tenantId,
    actor, action, entityType, entityId, details
  - AuditLogger: Interface (Outbound Port) mit log(AuditLogEntry)

  Jeder Service implementiert:
  - JpaAuditLogEntity: JPA-Entity für die audit_log Tabelle
  - JpaAuditLogger: Adapter der AuditLogger implementiert
  - Flyway-Migration für die audit_log Tabelle

  Die audit_log Tabelle ist append-only. Es gibt keine UPDATE- oder
  DELETE-Operationen auf dieser Tabelle. Die Application Services
  rufen AuditLogger.log() nach erfolgreichen schreibenden Operationen auf.

  Der actor wird über den SecurityContext ermittelt
  (SecurityAuditorAware-Pattern analog zur JPA-Auditing-Konfiguration).
