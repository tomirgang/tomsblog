text: |
  HTTP-Sessions werden über Spring Session Data Redis in einer externen
  Redis-Instanz gespeichert (ADR-0030). Redis läuft als Single-Instance
  Deployment im eigenen Kubernetes-Namespace (redis). Die Verbindung
  zwischen Blog-Pod und Redis ist durch Linkerd mTLS gesichert. Redis
  wird ohne Persistenz (kein RDB/AOF) betrieben, da Sessions kurzlebig
  und reproduzierbar sind. Passwort-Authentifizierung ist über ein
  Kubernetes-Secret konfiguriert. Network Policies beschränken den
  Zugriff auf Redis auf den tomsblog Namespace.
