text: |
  Alle Datenbank-Schema-Änderungen werden über Flyway-Migrationen verwaltet.
  Migrationsdateien liegen unter src/main/resources/db/migration/ mit dem
  Benennungsschema V{nummer}__{beschreibung}.sql.
  Hibernate ddl-auto ist auf validate gesetzt (nur Validierung, keine Änderung).
  Flyway wird beim Service-Start automatisch ausgeführt.
