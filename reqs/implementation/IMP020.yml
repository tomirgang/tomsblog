text: |
  Implementierung der OpenAPI-Dokumentation im Blog Content Service:
  - OpenApiConfiguration: Zentrale Konfiguration mit API-Metadaten und
    OperationCustomizer fuer X-Tenant-Id Header.
  - PostController: @Tag("Posts"), @Operation/@ApiResponse an allen Endpunkten.
  - TagController: @Tag("Tags"), @Operation/@ApiResponse an allen Endpunkten.
  - TranslationController: @Tag("Translations"), @Operation/@ApiResponse.
  - SourceController: @Tag("Sources"), @Operation/@ApiResponse.
  - application.yml: springdoc Konfiguration (api-docs path, swagger-ui path).
