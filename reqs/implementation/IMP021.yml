text: |
  Implementierung des Thymeleaf Layout-Grundgeruests im Blog Content Service:
  - BlogViewController: Spring @Controller als Inbound Web Adapter, liefert die
    Index-Seite ueber GET / aus.
  - layout/default.html: Basis-Layout mit PicoCSS (CDN), semantischem HTML5
    (header, nav, main, footer) und layout:fragment fuer Content-Austausch.
  - fragments/header.html: Wiederverwendbarer Seitenkopf mit Navigation.
  - fragments/footer.html: Wiederverwendbare Fusszeile.
  - index.html: Startseite mit layout:decorate Referenz auf das Default-Layout.
  - custom.css: Minimale Anpassungen und Tenant-Branding-Hooks.
