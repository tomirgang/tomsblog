text: |
  Implementierung der oeffentlichen Blog-Ansicht im Blog Content Service:
  - BlogViewController: GET /posts (Post-Liste), GET /posts/{slug} (Einzelansicht)
  - PostUseCase: listPublishedPosts(), getPublishedPostBySlug() als neue Inbound-Port-Methoden
  - PostRepository: findPublishedByTenantId(), findBySlugAndTenantId() als neue Outbound-Port-Methoden
  - PostService: Implementierung der neuen Use-Case-Methoden mit Status-Pruefung
  - JpaPostRepository/SpringDataPostRepository: JPA-Queries fuer Status-Filter und Slug-Suche
  - posts/list.html: Post-Liste mit Titel, Datum, Vorschau, Link zur Einzelansicht
  - posts/show.html: Einzelansicht mit Volltext, Quellen und Tags
  - error/404.html: Fehlerseite fuer nicht gefundene/nicht veroeffentlichte Posts
  - WebExceptionHandler: ControllerAdvice fuer 404-Fehler im Web-Layer
