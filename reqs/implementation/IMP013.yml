text: |
  Implementiert den TagUseCase als Inbound Port und den TagService als
  Application Service. Der TagService orchestriert Tag-Erstellung (mit
  Duplikat-Prüfung auf Name+Tenant), Umbenennung und Löschung.
  Prüft vor Erstellung, ob ein Tag mit gleichem Namen im Tenant existiert.
