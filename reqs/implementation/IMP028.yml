text: |
  Die buildExcerpts()-Methode im BlogViewController rendert zuerst den
  Content (Markdown zu HTML falls nötig), dann extrahiert
  extractFirstParagraph() das erste <p>-Element per Regex. Die Post-Liste
  zeigt das Ergebnis via th:utext als gerenderten HTML-Ausschnitt. Ist kein
  <p>-Element vorhanden, wird der gesamte gerenderte Inhalt als Vorschau
  verwendet.
