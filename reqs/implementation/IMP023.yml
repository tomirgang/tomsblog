text: |
  Implementierung des Thymeleaf-Formulars zum Erstellen und Bearbeiten von Blog-Posts (SWR-027).
  Der BlogViewController wurde um vier Handler-Methoden erweitert: newPostForm (GET /posts/new),
  createPost (POST /posts), editPostForm (GET /posts/{id}/edit) und updatePost (POST /posts/{id}).
  Die PostFormData-Klasse dient als Form-Backing-Bean mit Bean Validation.
  Die Post-Liste zeigt Links zum Erstellen und Bearbeiten.
