text: |
  Die Landing Page (GET /) ruft listRecentPublishedPosts(tenantId, 3) auf.
  Der JpaPostRepository implementiert dies mit PageRequest.of(0, limit) auf
  der bestehenden findPublishedByTenantId-Query. Authentifizierte Nutzer
  sehen ebenfalls maximal 3 Posts (Sublist aus listPosts). Ein Link zu
  /posts ermöglicht den Zugriff auf die vollständige Liste.
