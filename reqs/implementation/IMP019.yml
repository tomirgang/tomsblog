  Flyway SQL-Migrationen für den Blog Content Service.
  V1: posts (mit post_tags, post_sources, post_attachments Tabellen).
  V2: tags (mit Unique-Indexes auf tenant_id+name und tenant_id+slug).
  V3: translations (mit FK auf posts, Unique auf post_id+locale).
  Schema wird beim Anwendungsstart automatisch migriert.
