text: |
  Implementiert das Post-Aggregate mit Statusübergängen (DRAFT -> PUBLISHED -> ARCHIVED),
  Slug-Generierung, AuthorId-Referenz, TagId-basierter Verschlagwortung,
  Quellenverwaltung (List<Source>), Attachment-Verwaltung (List<Attachment>)
  und Domain-Event-Registrierung. Reine Java-Klasse ohne Framework-Abhängigkeiten.
