text: |
  Das ContentType-Enum (HTML, MARKDOWN) wird im Domain-Modell definiert.
  Die PostJpaEntity bildet es als VARCHAR-Spalte ab. Der PostMapper
  konvertiert bidirektional. Die Flyway-Migration V4 fügt die Spalte
  content_type mit Default 'HTML' hinzu, sodass bestehende Posts
  automatisch als HTML-Posts gelten.
