text: |
  JPA Outbound Adapter für den TranslationRepository Port.
  Implementiert Persistenz über Spring Data JPA mit TranslationJpaEntity.
  Alle Abfragen sind Tenant-scoped. TranslationMapper übernimmt bidirektionales
  Mapping zwischen Domain-Translation und TranslationJpaEntity.
  FK-Beziehung zu posts-Tabelle, Unique Constraint auf (post_id, locale).
