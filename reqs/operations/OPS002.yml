text: |
  Es muss ein Disaster-Recovery-Plan existieren, der den vollstaendigen
  Neuaufbau des Clusters und die Wiederherstellung der Daten beschreibt.
  Der Plan muss regelmaessig (mindestens quartalsweise) getestet werden.
  Dokumentierte Szenarien: Einzelner Pod, Worker Node, PostgreSQL Primary,
  gesamter Cluster, Datenbank-Corruption.
