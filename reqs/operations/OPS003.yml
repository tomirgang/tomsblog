text: |
  Bei kritischen Zustaenden muss automatisch ein Alert ausgeloest werden.
  Kritische Zustaende umfassen: Service nicht erreichbar, Fehlerrate > 5%,
  Disk-Usage > 80%, PostgreSQL-Failover, Flux-Reconciliation fehlgeschlagen,
  Zertifikat laeuft in < 7 Tagen ab. Benachrichtigung per E-Mail oder
  Messaging-Integration.
