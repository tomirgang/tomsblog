text: |
  Der User-Management-Service stellt unter /auth/admin/users eine
  Thymeleaf-Seite bereit (ADR-0032), die alle Benutzer des aktuellen
  Tenants auflistet (Name, E-Mail, Rolle, Approval-Status). Verfuegbare
  Aktionen: Approve, Reject, Rolle aendern. Zugriff nur fuer Benutzer
  mit Rolle ADMIN oder SUPERADMIN. Der Controller greift direkt auf
  den lokalen UserProfileUseCase zu (kein gRPC-Umweg).
