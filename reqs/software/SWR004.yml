text: |
  Der Autor kann über POST /api/posts/{id}/translate eine KI-Übersetzung
  ausloesen. Das Ergebnis wird als Entwurf gespeichert und dem Autor
  zur Prüfung angezeigt. Erst nach expliziter Freigabe wird die
  Übersetzung übernommen.
