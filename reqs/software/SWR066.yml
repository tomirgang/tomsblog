text: |
  Die Shared UI Library muss ein Master-Layout-Template
  (templates/shared/layout/default.html) bereitstellen, das von allen
  Services als Basis-Layout verwendet wird. Das Layout definiert die
  HTML-Grundstruktur (Head mit Pico CSS, Body mit Header-, Content-
  und Footer-Bereichen) und nutzt das Thymeleaf Layout Dialect für
  Content-Injection. Services können das gemeinsame Layout über
  layout:decorate="~{shared/layout/default}" referenzieren.
