text: |
  Alle API-Eingaben müssen serverseitig validiert werden (Bean Validation).
  XSS-Schutz bei der Ausgabe von User-Content. CSRF-Schutz fuer
  zustandsbehaftete Endpunkte. SQL-Injection-Schutz durch Prepared Statements.
