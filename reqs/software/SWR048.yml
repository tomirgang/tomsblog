text: |
  Asynchrone Aufgaben, die genau einmal verarbeitet werden müssen
  (z.B. Übersetzungen, TTS-Generierung, Snapshot-Erstellung,
  Benachrichtigungen), werden über RabbitMQ-Task-Queues verteilt
  (ADR-0018). RabbitMQ wird für Work-Queues mit Einzelverarbeitung
  verwendet, bei denen ein Job an genau einen Worker geht.
