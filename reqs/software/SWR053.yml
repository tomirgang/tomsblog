text: |
  Der SuperAdmin kann über einen Tenant-Selector in der Admin-Navigation
  den aktiven Tenant wechseln. Die Auswahl wird in der HTTP-Session
  gespeichert und überschreibt den Standard-Tenant für alle nachfolgenden
  Requests. Reguläre Admins sind an ihren Tenant gebunden und sehen
  keinen Selector. Der Blog-Content-Service ruft die Liste aller Tenants
  über gRPC vom User-Management-Service ab. POST /admin/switch-tenant
  speichert die Auswahl in der Session und leitet auf die aktuelle Seite
  zurück.
