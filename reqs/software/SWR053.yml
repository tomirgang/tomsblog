text: |
  Der SuperAdmin kann ueber einen Tenant-Selector in der Admin-Navigation
  des User-Management-Service den aktiven Tenant wechseln (ADR-0032).
  Die Auswahl wird in der HTTP-Session (Redis, SWR-064) gespeichert
  und ueberschreibt den Standard-Tenant fuer alle nachfolgenden Requests.
  Regulaere Admins sind an ihren Tenant gebunden und sehen keinen
  Selector. Der Controller greift direkt auf den lokalen
  TenantSettingsUseCase zu (kein gRPC-Umweg). POST /auth/admin/switch-tenant
  speichert die Auswahl in der Session und leitet auf die aktuelle
  Seite zurueck.
