text: |
  Ein Post kann ueber POST /api/posts/{id}/publish veroeffentlicht werden.
  Dabei wird der Status auf PUBLISHED gesetzt und ein PostPublishedEvent erzeugt.
  Ein bereits veroeffentlichter Post kann nicht erneut veroeffentlicht werden.
