text: |
  Ein Post kann über POST /api/posts/{id}/publish veröffentlicht werden.
  Dabei wird der Status auf PUBLISHED gesetzt und ein PostPublishedEvent erzeugt.
  Ein bereits veröffentlichter Post kann nicht erneut veröffentlicht werden.
