text: |
  Der User-Management-Service stellt unter /auth/admin/settings eine
  Thymeleaf-Seite bereit (ADR-0032), die die Tenant-Einstellungen
  (Login-Mode, Auto-Approval-Regeln, Branding mit displayName und
  tagline) anzeigt und bearbeitbar macht. Zugriff nur fuer Benutzer
  mit Rolle ADMIN oder SUPERADMIN. Der Controller greift direkt auf
  den lokalen TenantSettingsUseCase zu (kein gRPC-Umweg).
