text: |
  Alle externen Zugriffe auf die Plattform müssen über HTTPS (TLS 1.2+)
  verschlüsselt erfolgen. HTTP-Anfragen auf Port 80 werden automatisch
  auf HTTPS (Port 443) umgeleitet. TLS-Zertifikate werden automatisch
  über Let's Encrypt (ACME-Protokoll) bereitgestellt und vor Ablauf
  erneuert. Die TLS-Terminierung erfolgt am Ingress-Controller.
