text: |
  HTTP-Sessions des Blog Content Service müssen in einem externen
  Session-Store (Redis) statt im Servlet-Container gespeichert werden.
  Alle Session-Daten (Spring Security Authentication, Rollen, Tenant-
  Auswahl) müssen über alle Replicas des Services hinweg verfügbar sein.
  Spring Session Data Redis wird als Implementierung verwendet.
