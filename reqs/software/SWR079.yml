text: |
  Selenium-E2E-Tests verifizieren alle öffentlich zugänglichen
  Blog-Content-Seiten im Browser:
  - Landing Page: Featured Posts und Recent Posts werden angezeigt
  - Post-Liste: Vollständige Liste mit Volltextsuche funktioniert
  - Post-Detailansicht: Slug-basierter Zugriff, Markdown korrekt gerendert
  - Legal Pages: Impressum und Datenschutzerklärung erreichbar
  - Fehlerseiten: 404-Seite bei unbekanntem Slug
