text: |
  Die TenantSettings werden um zwei optionale TEXT-Felder impressum_content
  und privacy_policy_content erweitert. Sind diese konfiguriert, wird deren
  Inhalt (HTML) auf /impressum bzw. /privacy anstelle des Platform-Defaults
  gerendert. Die Konfiguration erfolgt über die Admin-Einstellungen-Seite.
