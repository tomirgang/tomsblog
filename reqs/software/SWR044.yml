text: |
  Der User-Management-Service verwaltet pro Tenant die konfigurierte
  Login-Methode (SWR-043) und stellt die zugehoerige Login-UI selbst
  bereit (ADR-0032):
  - LoginMode Enum: INTERNAL (nur formbasiert), OIDC (nur OIDC-Provider),
    BOTH (formbasiert und OIDC). Standard bei Neuanlage: INTERNAL.
  - Die Login-Methode wird als Tenant-Einstellung gespeichert und
    direkt beim Rendern der Login-Seite ausgewertet (kein gRPC-Umweg).
  - Wird der LoginMode auf OIDC oder BOTH gesetzt, muessen oidcIssuerUrl
    und oidcClientId konfiguriert sein (Validierung im Service).
  - Die Login-Seite wird unter /auth/login vom User-Management-Service
    bereitgestellt. Der Blog Content Service leitet unauthentifizierte
    Benutzer per Redirect dorthin weiter.
  - Wenn LoginMode OIDC ist, zeigt die Login-Seite nur den
    OIDC-Login-Button.
  - Unabhaengig vom LoginMode steht unter /auth/admin/login ein
    separates formbasiertes Login-Formular bereit (Break-Glass-Loesung).
    Nur der SUPERADMIN kann sich dort anmelden. Die Credentials werden
    ueber die Infrastruktur gesetzt (Umgebungsvariable/Secret).
  - Der User-Management-Service wertet den LoginMode beim Rendern der
    Login-Seite aus und zeigt entsprechend Formular, OIDC-Button oder
    beides an.
