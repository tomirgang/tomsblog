text: |
  REST-Endpunkte und GraphQL-Schemas dürfen ausschließlich für die
  Kommunikation mit externen Clients bereitgestellt werden (Web-UI,
  Mobile-Apps, BFF-Layer). Für die Kommunikation zwischen Services
  sind nur gRPC (synchron, SWR-046), Kafka (Event-Streaming, SWR-047)
  und RabbitMQ (Task-Queues, SWR-048) zulässig. Bestehende interne
  REST-APIs (z.B. User-Management POST /api/users/sync) müssen
  mittelfristig auf gRPC migriert werden.
