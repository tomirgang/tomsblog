text: |
  Das System muss fünf Rollen unterstützen: SUPERADMIN, ADMIN, AUTHOR,
  REVIEWER, READER.
  SUPERADMIN verwaltet Tenants und die Plattform-Konfiguration. Sein
  Passwort wird ausschließlich über die Infrastruktur gesetzt
  (Umgebungsvariable/Secret). Es gibt genau einen SUPERADMIN pro
  Plattform-Instanz.
  ADMIN verwaltet Benutzer und Inhalte innerhalb eines Tenants und gibt
  neue Benutzer frei (STK028).
  AUTHOR darf Posts erstellen, bearbeiten und veröffentlichen.
  REVIEWER darf Posts lesen und Review-Feedback geben, aber nicht erstellen.
  READER hat nur Lesezugriff auf veröffentlichte Posts.
  Nicht angemeldete Benutzer werden wie READER behandelt (STK029).
