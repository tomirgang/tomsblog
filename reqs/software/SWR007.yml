  Das System muss drei Rollen unterstuetzen: ADMIN, AUTHOR, READER.
  Nur AUTHOR und ADMIN duerfen Posts erstellen/bearbeiten.
  Nur ADMIN darf Tenants und Benutzer verwalten.
  READER hat nur Lesezugriff auf veroeffentlichte Posts.
