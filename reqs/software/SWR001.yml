text: |
  Das System muss eine REST API bereitstellen mit Endpunkten fuer:
  POST /api/posts (erstellen), GET /api/posts/{id} (lesen),
  PUT /api/posts/{id} (aktualisieren), DELETE /api/posts/{id} (loeschen).
  Alle Endpunkte muessen die TenantId des authentifizierten Benutzers beruecksichtigen.
