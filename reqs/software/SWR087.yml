text: |
  Jeder Service (Blog Content, User Management, Tenant Management) erhält
  einen Inbound Port (AuditLogQueryUseCase) zur Abfrage von Audit-Einträgen.
  Der Port bietet folgende Operationen:

  - findAll(tenantId, pageable): Paginierte Abfrage aller Einträge eines
    Tenants, sortiert nach Zeitstempel absteigend
  - search(tenantId, criteria, pageable): Gefilterte und/oder durchsuchte
    Abfrage mit optionalen Kriterien (Aktionstyp, Entitätstyp, Akteur,
    Zeitraum von/bis, Freitextsuche)

  Die Outbound-Adapter (SpringDataAuditLogRepository) werden um die
  entsprechenden Abfragemethoden erweitert (Spring Data JPA Specifications
  oder Query Methods).
