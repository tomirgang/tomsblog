text: |
  Das Kommentarsystem muss Shadow-Banning unterstützen. Ein
  shadow-gebannter Benutzer sieht seine eigenen Kommentare weiterhin
  normal, andere Benutzer sehen diese Kommentare jedoch nicht.
  Administratoren und Autoren können Shadow-Bans vergeben und aufheben.
