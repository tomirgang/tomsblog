text: |
  Alle schreibenden Aktionen werden in einem unveränderlichen Audit-Log
  protokolliert. Jeder Eintrag enthält: Zeitstempel (wann), Akteur (wer),
  Aktion (was), betroffene Entität (Typ und ID), Tenant-ID und optionale
  Details (JSON). Die Audit-Log-Tabelle ist append-only (kein UPDATE/DELETE).

  Blog Content Service auditierte Aktionen:
  - Post: erstellt, aktualisiert, veröffentlicht, gelöscht
  - Tag: erstellt, umbenannt, gelöscht
  - Translation: erstellt, aktualisiert, freigegeben, abgelehnt, gelöscht
  - Source: hinzugefügt, entfernt

  User Management Service auditierte Aktionen:
  - User: synchronisiert (OIDC/intern), freigegeben, abgelehnt
  - Globale Rolle: zugewiesen, entfernt
  - Tenant-Mitgliedschaft: hinzugefügt, entfernt
  - Tenant-Einstellungen: aktualisiert
