text: |
  Die Admin-Oberfläche muss eine Navigation (z.B. Tabs oder
  Seitenleiste) bereitstellen, über die der Administrator zwischen
  den verschiedenen Einstellungsgruppen eines Tenants wechseln kann,
  ohne die Seite vollständig neu laden zu müssen.
