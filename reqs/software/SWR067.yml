text: |
  Die Shared UI Library muss die gemeinsamen CSS-Styles
  (static/css/custom.css) bereitstellen, die das Basisdesign der
  Plattform definieren (Pico CSS Anpassungen, Sticky-Footer-Layout,
  Tenant-Branding-Hooks). Alle Services verwenden diese gemeinsame
  CSS-Datei anstelle eigener Kopien. Service-spezifische
  Erweiterungen können über zusätzliche CSS-Dateien im jeweiligen
  Service ergänzt werden.
