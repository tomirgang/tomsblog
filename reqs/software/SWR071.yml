text: |
  Jedes Einstellungsformular muss über eine eigene Speichern-Aktion
  verfügen, die nur die Felder der jeweiligen Einstellungsgruppe
  persistiert. Das Speichern einer Einstellungsgruppe darf keine
  Auswirkungen auf die Werte anderer Einstellungsgruppen haben.
