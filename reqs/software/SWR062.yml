text: |
  Die bestehende Admin-Einstellungsseite (/admin/settings) wird um eine
  OIDC-Konfigurationssektion erweitert. Die Sektion ist nur sichtbar,
  wenn die Login-Methode OIDC oder BOTH ist.

  Formularfelder:
  - Issuer-URL (text, Pflichtfeld bei OIDC/BOTH)
  - Client-ID (text, Pflichtfeld bei OIDC/BOTH)
  - Client-Secret (password, optional, Platzhalter "***" wenn bereits gesetzt)

  Verhalten:
  - Beim Laden der Seite werden die bestehenden Werte angezeigt
    (Secret maskiert als "***").
  - Beim Speichern wird das Secret nur aktualisiert, wenn ein neuer Wert
    eingegeben wurde (leeres Feld = bestehender Wert bleibt erhalten).
  - Validierungsfehler (z.B. fehlende Pflichtfelder bei OIDC-Login-Modus)
    werden als Fehlermeldung auf der Seite angezeigt.
