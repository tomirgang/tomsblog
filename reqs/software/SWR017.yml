text: |
  Die Tenant-Zuordnung eines Requests muss über die verwendete Domain
  oder Subdomain erfolgen. Ein Tenant kann mehrere Domains und Subdomains
  konfigurieren (z.B. eigene Domain, Subdomain der Plattform). Das System
  muss die TenantId aus dem Host-Header des eingehenden Requests auflösen.
