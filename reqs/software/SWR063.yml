text: |
  Der Blog Content Service nutzt die tenant-spezifische OIDC-Konfiguration
  aus den TenantSettings, um den Spring Security OAuth2 Client dynamisch
  zu konfigurieren. Dazu wird ein ClientRegistrationRepository implementiert,
  das die OIDC-Konfiguration pro Tenant aus dem User Management Service
  (via gRPC) abruft und als ClientRegistration bereitstellt.

  Verhalten:
  - Bei jedem OIDC-Login-Versuch wird die aktuelle Tenant-Konfiguration
    aus den TenantSettings geladen (mit Caching, TTL 5 Minuten).
  - Ist keine tenant-spezifische Konfiguration vorhanden, wird die globale
    OIDC-Konfiguration aus application.yml als Fallback verwendet.
  - Änderungen an der OIDC-Konfiguration werden nach Ablauf des Cache-TTL
    wirksam (kein Neustart erforderlich).
  - Die Issuer-URL wird für OpenID Connect Discovery verwendet, um die
    konkreten Endpunkte (Authorization, Token, UserInfo, JWKS)
    automatisch aufzulösen.
