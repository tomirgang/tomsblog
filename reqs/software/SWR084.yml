text: |
  Der Blog Content Service stellt unter /admin/tags eine Thymeleaf-Seite
  bereit, die alle Tags des aktuellen Tenants auflistet. Administratoren
  und Autoren können:
  - Neue Tags anlegen (Name eingeben, Slug wird automatisch generiert).
  - Bestehende Tags umbenennen.
  - Tags löschen.
  Die Seite ist nur für authentifizierte Benutzer zugänglich.
  Der Controller nutzt den bestehenden TagUseCase (SWR-020).
