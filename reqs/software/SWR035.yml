text: |
  Blog-Posts können wahlweise in HTML oder Markdown verfasst werden. Der
  Content-Type wird pro Post gespeichert. Markdown-Inhalte werden serverseitig
  mit flexmark-java zu HTML gerendert. Mermaid-Diagramme und Code-Blöcke mit
  Syntax-Highlighting werden clientseitig via Mermaid.js und highlight.js
  dargestellt.
