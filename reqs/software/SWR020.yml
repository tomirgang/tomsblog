text: |
  Das System muss eine REST API für Tag-Verwaltung bereitstellen:
  POST /api/tags (Tag erstellen), GET /api/tags (alle Tags des Tenants),
  GET /api/tags/{id} (einzelnen Tag lesen),
  PUT /api/tags/{id} (Tag umbenennen), DELETE /api/tags/{id} (Tag löschen).
  Tag-Namen müssen pro Tenant eindeutig sein.
  Alle Endpunkte sind Tenant-scoped über den X-Tenant-Id Header.
