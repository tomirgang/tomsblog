text: |
  Der Feed-Service konsumiert PostPublishedEvent und PostUpdatedEvent
  via Kafka (Consumer Group feed-service). Beim Empfang eines
  PostPublishedEvent wird ein FeedEntry erstellt oder aktualisiert.
  Beim Empfang eines PostUpdatedEvent wird ein bestehender FeedEntry
  aktualisiert (Titel, Slug, Locale). Alle Eintraege sind
  tenant-isoliert. Nicht publizierte Posts werden bei PostUpdatedEvent
  ignoriert (kein FeedEntry vorhanden).
