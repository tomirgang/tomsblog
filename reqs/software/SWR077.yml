text: |
  Das Post-Bearbeitungsformular (form.html) enthält einen
  Vorschau-Button, der den Post in einem neuen Browser-Tab als
  vollständig gerenderte Vorschau öffnet (Link zu /posts/{id}/preview).

  Der Button ist sowohl beim Erstellen (nach erstem Speichern) als auch
  beim Bearbeiten eines bestehenden Posts sichtbar. Für neue Posts, die
  noch nicht gespeichert wurden (kein ID vorhanden), ist der Button
  deaktiviert oder ausgeblendet.
