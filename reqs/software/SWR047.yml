text: |
  Domain Events, die für service-übergreifende Konsistenz oder
  Benachrichtigungen relevant sind, werden über Apache Kafka publiziert
  und konsumiert (ADR-0006). Kafka wird für Event-Streaming verwendet,
  bei dem mehrere Consumer dasselbe Event unabhängig verarbeiten können
  (z.B. PostPublishedEvent, UserCreatedEvent).
