text: |
  Sensible Zugangsdaten (Passwörter, API-Keys, Tokens) dürfen nicht im Klartext
  im Git-Repository gespeichert werden. Sie müssen vor dem Commit verschlüsselt
  werden und beim Deployment automatisch entschlüsselt werden. Operator-generierte
  Secrets (z.B. Datenbank-Credentials) müssen automatisch in die Namespaces der
  konsumierenden Services synchronisiert werden, ohne manuelle Kopiervorgänge.
