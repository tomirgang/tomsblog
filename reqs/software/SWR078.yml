text: |
  Ein separates Maven-Modul e2e-tests/ stellt die E2E-Test-Infrastruktur
  bereit. Es enthält:
  - Selenium WebDriver mit Testcontainers-Selenium (Chrome-Container)
  - JUnit 5 Basis-Testklasse mit WebDriver-Lifecycle-Management
  - Page Object Model (POM) Basisklasse für alle Seiten-Abstraktionen
  - Screenshot-on-Failure JUnit 5 Extension (target/screenshots/)
  - Maven-Profil 'e2e' für gezielte Ausführung (mvn verify -Pe2e)
  - Lokale Ausführung ohne externen Browser (Testcontainers-Chrome)
  - Integration in das Release-Script (scripts/release.sh)
