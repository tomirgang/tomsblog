text: |
  Die Admin-Oberfläche für Tenant-Einstellungen muss die Einstellungen
  in separate Formulare pro Einstellungsgruppe aufteilen. Jedes Formular
  wird über einen eigenen HTTP-Endpunkt geladen und gespeichert. Die
  folgenden Einstellungsgruppen müssen als eigenständige Formulare
  dargestellt werden: Allgemeine Einstellungen (Blog-Name,
  Login-Methode, Auto-Approval), OIDC-Konfiguration (Issuer URL,
  Client ID, Client Secret), Impressum und Datenschutzerklärung.
