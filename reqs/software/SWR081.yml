text: |
  Selenium-E2E-Tests verifizieren die Authentifizierungs- und
  Registrierungs-Workflows im Browser:
  - Login mit internem Account (Formular, Credentials, Redirect)
  - Registrierung: Formular mit Validierung (Client- und Server-seitig)
  - Registrierung: Erfolgsseite nach erfolgreicher Absendung
  - Break-Glass Admin-Login: SuperAdmin-Zugang unter /auth/admin/login
