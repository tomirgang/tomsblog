text: |
  Alle synchronen Aufrufe zwischen Microservices müssen über gRPC
  erfolgen (ADR-0010). Jeder Service, der eine synchrone Schnittstelle
  für andere Services bereitstellt, definiert seine API als Protocol
  Buffers (.proto) im Modul event-contracts. REST- oder GraphQL-Endpunkte
  dürfen nicht für Service-zu-Service-Kommunikation genutzt werden.
