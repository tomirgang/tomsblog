text: |
  Das System muss unter /impressum und /privacy statische Seiten bereitstellen,
  die im Footer verlinkt werden. Der Inhalt wird als Platform-Default
  ausgeliefert, solange kein Tenant-spezifischer Inhalt konfiguriert ist.
  Die Seiten verwenden das Standard-Layout (Header, Footer, Navigation).
