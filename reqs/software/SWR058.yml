text: |
  Der Blog Content Service muss mit mindestens 2 Replicas auf Kubernetes
  betrieben werden. Die Rolling-Update-Strategie stellt sicher, dass
  mindestens eine Instanz immer verfügbar ist. Benutzer-Sessions bleiben
  über Pod-Wechsel erhalten (abhängig von SWR-057).
