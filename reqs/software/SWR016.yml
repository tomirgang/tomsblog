text: |
  Das System muss einen eigenen Identity Provider Service bereitstellen.
  Dieser Service muss OpenID Connect (OIDC) Login unterstützen, sodass
  Benutzer sich über externe OIDC Provider (z.B. Google, GitHub) anmelden
  können. Der Service verwaltet Benutzerkonten, Rollen und Sessions.
