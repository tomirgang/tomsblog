text: |
  Das System muss OpenID Connect (OIDC) Login über Authentik
  (https://auth.do9ita.de) als externen Identity Provider unterstützen
  (siehe ADR-0027). Der Authorization Code Flow mit PKCE wird verwendet.
  Services, die eine Web-Oberfläche bereitstellen (z.B. Blog Content
  Service), agieren als OAuth2 Client (Spring Security OAuth2 Login).
  API-Endpunkte werden als OAuth2 Resource Server geschützt und validieren
  Authentik-JWTs. Authentik übernimmt Login-Flows, MFA, Session-Management
  und Passwort-Policies. Dies ersetzt die einfache formbasierte
  Admin-Authentifizierung (SWR-028).
  Optional können Gruppen-Attribute aus dem OIDC ID Token (groups Claim)
  übernommen und auf plattforminterne Rollen gemappt werden. Das Mapping
  ist pro Tenant konfigurierbar.
