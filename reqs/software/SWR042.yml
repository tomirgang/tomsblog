text: |
  Die Landing Page (Route „/") zeigt zusätzlich zu den neuesten Posts
  einen eigenen Bereich für aktuell gefeatured Posts:
  - Featured Posts werden in einem visuell abgesetzten Bereich oberhalb
    der neuesten Posts dargestellt.
  - Ein Post gilt als featured, wenn das aktuelle Datum im Intervall
    [featuredFrom, featuredUntil] liegt und der Post den Status PUBLISHED hat.
  - Featured Posts werden nach featuredFrom absteigend sortiert (neueste zuerst).
  - Ein Post, der sowohl featured als auch unter den neuesten 3 Posts ist,
    erscheint in beiden Bereichen.
  - Das PostRepository erhält eine Methode zum Abfragen aktuell gefeatured
    Posts eines Tenants.
  - Der Thymeleaf-Controller übergibt die Featured Posts als eigenes
    Modell-Attribut an das Landing-Page-Template.
