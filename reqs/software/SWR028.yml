header: |
  Einfacher Admin-Login zum Schutz der Schreiboperationen
level: 28.0
links:
- STK005: null
- SWR007: null
normative: true
ref: ''
reviewed: null
text: |
  Der Blog Content Service muss einen einfachen formbasierten Admin-Login bereitstellen, der alle Schreiboperationen schützt:
  - Spring Security sichert alle schreibenden Endpunkte (POST, PUT, DELETE auf /api/** sowie POST /posts, GET /posts/new, GET /posts/{id}/edit).
  - Die öffentliche Web-Ansicht (GET /posts, GET /posts/{slug}) zeigt nur veröffentlichte Posts (Status PUBLISHED) an.
  - Nach Login zeigt die Web-Ansicht (GET /posts) alle Posts inklusive Drafts und archivierte Posts mit Status-Anzeige.
  - Die REST-API (GET /api/posts/**) ist vollständig geschützt und zeigt alle Posts unabhängig vom Status.
  - Die Authentifizierung erfolgt über ein HTML-Login-Formular unter /login.
  - Es wird ein einzelner Admin-Benutzer unterstützt, dessen Credentials über Spring-Properties konfiguriert werden (blog.admin.username, blog.admin.password).
  - Nach erfolgreichem Login wird der Benutzer auf die Post-Liste weitergeleitet.
  - Ein Logout-Link ist im Header sichtbar, wenn der Benutzer eingeloggt ist.
  - Die REST-API (/api/**) nutzt HTTP Basic Authentication als Alternative zum formbasierten Login.
  - Dies ist eine MVP-Lösung für Phase 2. In Phase 4 wird sie durch den Custom Identity Provider (SWR-016) ersetzt.
