text: |
  Die Plattform muss ueber einen vollstaendigen Observability-Stack verfuegen:
  Prometheus (Metriken), Grafana (Dashboards), Loki (Log-Aggregation) und
  Tempo (Distributed Tracing). Alerting muss bei kritischen Zustaenden
  (Service down, hohe Fehlerrate, Disk voll) automatisch ausgeloest werden.
