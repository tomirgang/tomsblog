text: |
  Die PostgreSQL-Datenbank muss regelmaessig gesichert werden. Zielwerte:
  RPO (Recovery Point Objective) < 1 Stunde durch WAL-Streaming,
  RTO (Recovery Time Objective) < 15 Minuten durch Restore aus Backup.
  Backups werden auf S3-kompatiblem Storage (Garage auf Netcup VM) gespeichert.
  Retention: 30 Tage. Regelmäßige Restore-Tests muessen durchgefuehrt werden.
