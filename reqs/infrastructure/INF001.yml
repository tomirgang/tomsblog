text: |
  Die Plattform muss auf einem Kubernetes-Cluster (k3s) bei Hetzner Cloud
  betrieben werden. Das Cluster wird mit dem CLI-Tool hetzner-k3s provisioniert.
  Konfiguration: 1 Controller (CPX22, 2 vCPU, 4 GB) + 2 Worker Nodes (CPX22, 2 vCPU, 4 GB),
  CNI Flannel, Hetzner CSI für Storage.
