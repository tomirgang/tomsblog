text: |
  Container-Images muessen mit eindeutigen, versionierten Tags (Commit-SHA
  oder Semver) versehen werden. Die CI-Pipeline aktualisiert nach erfolgreichem
  Build automatisch den Image-Tag im Deployment-Manifest und committet die
  Aenderung. Flux erkennt den neuen Commit und loest ein Rolling Update aus.
  Der Tag latest darf nicht fuer Produktiv-Deployments verwendet werden.
