text: |
  Alle externen Endpunkte muessen ueber HTTPS mit gueltigem TLS-Zertifikat
  erreichbar sein. Zertifikate werden automatisch ueber cert-manager und
  Let's Encrypt (ACME HTTP-01) bereitgestellt und vor Ablauf erneuert.
  HTTP-Anfragen werden permanent auf HTTPS umgeleitet (301).
