text: |
  Alle Pod-zu-Pod-Verbindungen innerhalb des Clusters muessen durch Linkerd
  mTLS verschluesselt werden. Jeder Pod in meshed Namespaces erhaelt
  automatisch einen Sidecar-Proxy. Die Zertifikats-Hierarchie umfasst
  Trust Anchor (10 Jahre), Identity Issuer (1 Jahr, cert-manager-rotiert)
  und Workload Certificates (24h, automatisch).
