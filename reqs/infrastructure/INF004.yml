text: |
  Secrets (Passwörter, API-Keys, OAuth-Credentials) muessen mit SOPS und
  age verschluesselt im Git-Repository gespeichert werden. Nur die
  data/stringData-Felder der Secret-Manifeste werden verschluesselt.
  Flux entschluesselt sie automatisch beim Deployment. Der private
  age-Schluessel liegt ausschliesslich als Secret im Cluster.
