text: |
  PostgreSQL muss ueber den CloudNativePG Operator als Kubernetes Custom
  Resource betrieben werden. Die Konfiguration umfasst mindestens 2 Instanzen
  (Primary + Replica) mit automatischem Failover. Der Operator verwaltet
  den gesamten Lifecycle (Provisioning, Failover, Scaling, Credential-Rotation).
