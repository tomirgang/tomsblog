text: |
  Redis muss als Single-Instance Deployment im Namespace redis auf
  Kubernetes betrieben werden. Das Deployment umfasst: Deployment mit
  Security Context (non-root, read-only Filesystem), ClusterIP Service
  auf Port 6379, Network Policy die Ingress nur aus dem tomsblog
  Namespace erlaubt, Passwort-Authentifizierung über Kubernetes Secret.
  Die Kustomize-Manifeste liegen in infra/k8s/redis/. Redis wird ohne
  Persistenz betrieben (keine RDB/AOF-Snapshots).
