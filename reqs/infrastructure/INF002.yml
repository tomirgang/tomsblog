text: |
  Alle Kubernetes-Ressourcen muessen deklarativ in Git verwaltet und durch
  Flux automatisch auf den Cluster synchronisiert werden. Manuelle kubectl-Änderungen
  sind im Produktivbetrieb nicht erlaubt. Flux beobachtet das App-Repository
  (Pfad infra/k8s/) und das IaC-Repository mit einem Poll-Intervall von 10 Minuten.
