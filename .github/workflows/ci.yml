name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw verify --batch-mode --no-transfer-progress

      - name: Check formatting
        run: ./mvnw spotless:check --batch-mode --no-transfer-progress

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for report in $(find . -path '*/target/site/jacoco/jacoco.csv' 2>/dev/null); do
            module=$(echo "$report" | sed 's|^\./||;s|/target/site/jacoco/jacoco.csv||')
            echo "### Module: \`$module\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Parse CSV: columns are GROUP,PACKAGE,CLASS,INSTRUCTION_MISSED,INSTRUCTION_COVERED,BRANCH_MISSED,BRANCH_COVERED,LINE_MISSED,LINE_COVERED,...
            total_missed=0
            total_covered=0
            branch_missed=0
            branch_covered=0
            while IFS=',' read -r group package class instr_m instr_c br_m br_c line_m line_c _ _ _ _; do
              if [[ "$group" == "GROUP" ]]; then continue; fi
              total_missed=$((total_missed + line_m))
              total_covered=$((total_covered + line_c))
              branch_missed=$((branch_missed + br_m))
              branch_covered=$((branch_covered + br_c))
            done < "$report"
            total=$((total_missed + total_covered))
            branch_total=$((branch_missed + branch_covered))
            if [[ $total -gt 0 ]]; then
              pct=$((total_covered * 100 / total))
              echo "- **Line coverage**: ${pct}% (${total_covered}/${total})" >> $GITHUB_STEP_SUMMARY
            fi
            if [[ $branch_total -gt 0 ]]; then
              br_pct=$((branch_covered * 100 / branch_total))
              echo "- **Branch coverage**: ${br_pct}% (${branch_covered}/${branch_total})" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Doorstop
        run: pip install -r requirements.txt

      - name: Install Antora and extensions
        run: npm install && npm install -g @antora/cli @antora/site-generator

      - name: Generate Antora documentation
        run: antora antora-playbook.yml

      - name: Generate requirements report
        run: |
          doorstop publish all build/site/requirements/
          ./docs/scripts/inject-requirements-nav.sh build/site/requirements

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: build/site/
          retention-days: 14

      - name: Deploy to GitHub Pages (docs branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
          publish_branch: docs

  requirements:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Doorstop
        run: pip install -r requirements.txt

      - name: Validate requirements traceability
        run: doorstop

      - name: Generate requirements report
        run: doorstop publish all docs/requirements/

      - name: Upload requirements report
        uses: actions/upload-artifact@v4
        with:
          name: requirements-report
          path: docs/requirements/
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (skip tests, already passed)
        run: ./mvnw package -pl services/blog-content -am --batch-mode --no-transfer-progress -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/blog-content
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: services/blog-content
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-assets:
    runs-on: ubuntu-latest
    needs: [build, docs, requirements]
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (skip tests, already passed)
        run: ./mvnw package -pl services/blog-content -am --batch-mode --no-transfer-progress -DskipTests

      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: artifacts/documentation

      - name: Download requirements report artifact
        uses: actions/download-artifact@v4
        with:
          name: requirements-report
          path: artifacts/requirements-report

      - name: Package artifacts
        run: |
          cd artifacts/documentation && zip -r ../../documentation.zip . && cd ../..
          cd artifacts/requirements-report && zip -r ../../requirements-report.zip . && cd ../..

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            services/blog-content/target/blog-content-*.jar
            documentation.zip
            requirements-report.zip
